name: promo-voice
on:
  push:
    branches: [promo-voice]
    paths: ["voice/script.json", "voice/edge.py", ".github/workflows/voice.yml", "voice/RUN"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install edge-tts
      - run: python voice/edge.py 2>&1 | tee voice/edge-log.txt
        continue-on-error: true
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add voice/edge voice/edge-log.txt
          git commit -m "voice: edge audio" || echo "nothing to commit"
          git pull --rebase && git push
