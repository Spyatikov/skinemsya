name: promo-voice
on:
  push:
    branches: [promo-voice]
    paths: ["voice/script.json", "voice/tts.py", ".github/workflows/voice.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install edge-tts
      - run: rm -rf voice/out && python voice/tts.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add voice/out
          git commit -m "voice: generated audio" || echo "nothing to commit"
          git push
