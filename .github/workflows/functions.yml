name: Обновить сервер (Supabase Edge Function)
# При изменении кода сервера в main выкатывает функцию api в Supabase.
# Нужен секрет SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens). Без него задача пропускается.
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/functions.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ubpfdbojasicjhcciqjr
    steps:
      - name: Есть ли токен
        id: tok
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Секрет SUPABASE_ACCESS_TOKEN не задан — автообновление сервера пропущено"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.tok.outputs.ok == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.tok.outputs.ok == 'true'
        with:
          version: latest
      - name: Выкатить функцию api
        if: steps.tok.outputs.ok == 'true'
        run: supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
